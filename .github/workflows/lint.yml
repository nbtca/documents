name: Lint and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The job only reads the checkout; nothing here writes back to the repository.
permissions:
  contents: read

# A branch that gets several pushes in a row only needs its newest commit built.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --run

      - name: Run lint
        run: pnpm run ci:lint

      - name: Build site
        run: pnpm docs:build

      - name: Verify rendered output
        run: pnpm run ci:verify
